<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>後台人員：帳號與密碼管理中心</title>
  <link rel="stylesheet" href="/admin/css/StaffPasswordSetup.css">
</head>
<body>

  <header class="page-header">
    <div>
      <h2>後台人員：帳號與密碼管理中心</h2>
      <div class="subtitle">管理 T05_Staff 員工基本資料建置與密碼 SHA-256 安全雜湊儲存</div>
    </div>
    <div class="nav-links">
      <a href="/admin/DB_TableControl.html">← 返回資料庫控制台</a>
      <a href="/portal.html">專案門戶 →</a>
    </div>
  </header>

  <div id="alert-box" class="alert"></div>

  <!-- 兩大核心功能切換按鈕 -->
  <div class="mode-selector">
    <button class="mode-btn active" id="btn-mode-1" onclick="switchMode(1)">1. 未曾登記用戶 (建立新帳號)</button>
    <button class="mode-btn" id="btn-mode-2" onclick="switchMode(2)">2. 為未設定密碼的用戶設定密碼</button>
  </div>

  <!-- 模式 1：新增用戶表單 -->
  <div id="section-mode-1" class="card">
    <h3 style="margin-bottom: 16px;">登記新員工並指派密碼</h3>
    <form onsubmit="handleCreateUser(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>員工姓名 (ST_Name) <span class="req">*</span></label>
          <input type="text" id="m1-name" required placeholder="例如: Chan Tai Man">
        </div>

        <div class="form-group">
          <label>電郵地址 (ST_Email) <span class="req">*</span></label>
          <input type="text" id="m1-email" required placeholder="例如: tmchan@swd.gov.hk 或 tmchan">
        </div>

        <div class="form-group">
          <label>常用暱稱 (ST_NickName)</label>
          <input type="text" id="m1-nickname" placeholder="例如: Peter">
        </div>

        <div class="form-group">
          <label>職級 (ST_Rank)</label>
          <input type="text" id="m1-rank" placeholder="例如: AP2, API, CSA">
        </div>

        <div class="form-group">
          <label>職位 / 崗位 (ST_Post)</label>
          <input type="text" id="m1-post" placeholder="例如: AP(SD)2">
        </div>

        <div class="form-group">
          <label>部門 / 隸屬公司 (ST_Company_Department)</label>
          <input type="text" id="m1-dept" placeholder="例如: SWD / Contractor">
        </div>

        <div class="form-group">
          <label>系統權限等級 (ST_Right) <span class="req">*</span></label>
          <select id="m1-right" required>
            <option value="ADMIN">ADMIN (最高管理員)</option>
            <option value="GENERAL" selected>GENERAL (一般專案同仁)</option>
          </select>
        </div>

        <div class="form-group">
          <label>初始密碼 (ST_password_hash) <span class="req">*</span></label>
          <input type="text" id="m1-password" required placeholder="請輸入密碼 (寫入時將自動 SHA-256 雜湊)">
        </div>

        <div class="form-group full-width" style="margin-top: 10px;">
          <button type="submit" class="primary-btn">確認建立帳號並寫入資料庫</button>
        </div>
      </div>
    </form>
  </div>

  <!-- 模式 2：未設定密碼列表 -->
  <div id="section-mode-2" class="card" style="display: none; max-width: 100%;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="margin: 0;">尚未設定密碼之同仁名冊 (ST_password_hash 為 NULL)</h3>
      <button class="primary-btn" style="padding: 6px 14px; font-size: 13px;" onclick="loadUsersWithoutPassword()">重新整理名冊</button>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 70px;">ID</th>
            <th>姓名 (ST_Name)</th>
            <th>暱稱</th>
            <th>職級</th>
            <th>部門</th>
            <th>目前權限</th>
            <th style="width: 320px;">設定新密碼 (立即 Hash 寫入)</th>
          </tr>
        </thead>
        <tbody id="no-pwd-tbody">
          <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">正在檢查未設定密碼的用戶...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/admin/js/StaffPasswordSetup.js"></script>
</body>
</html>
