<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ProjectBook 連線診斷測試</title>
    <style>
        body { font-family: sans-serif; padding: 30px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 6px; max-width: 600px; margin-bottom: 20px; }
        button { padding: 10px 18px; font-size: 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #result { margin-top: 15px; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 14px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="box">
        <h2>1. 靜態網頁載入測試</h2>
        <p style="color: green; font-weight: bold;">✔ 若您能看到此畫面，表示靜態檔案伺服與 8080 埠連線正常！</p>
        <p>目前訪問位址：<span id="currentUrl"></span></p>
    </div>

    <div class="box">
        <h2>2. 後端 API 雙向連線測試 (Ping)</h2>
        <p>點擊下方按鈕，向後端發送一個不依賴資料庫的輕量測試請求：</p>
        <button onclick="testPing()">測試 API 連線</button>
        <div id="result">尚未進行測試</div>
    </div>

    <script>
        document.getElementById('currentUrl').textContent = window.location.href;

        function testPing() {
            var resBox = document.getElementById('result');
            resBox.className = '';
            resBox.textContent = '連線測試中...';

            fetch('/api/ping')
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    resBox.className = 'success';
                    resBox.textContent = '✔ 連線成功！後端回傳：' + JSON.stringify(data);
                })
                .catch(function(err) {
                    resBox.className = 'fail';
                    resBox.textContent = '✘ 連線失敗：' + err.message;
                });
        }
    </script>

</body>
</html>
